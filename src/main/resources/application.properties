server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8081}
spring.datasource.url=${LIFEORG_DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:life_organizer}}
spring.datasource.username=${LIFEORG_DB_USER:${MYSQLUSER:root}}
spring.datasource.password=${LIFEORG_DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/upgrade_all.sql
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.jackson.serialization.write-dates-as-timestamps=false
